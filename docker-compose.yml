services:
  postgres:
    image: postgres:16-alpine
    container_name: affiliateos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: affiliateos
      POSTGRES_PASSWORD: affiliateos
      POSTGRES_DB: affiliateos
    ports:
      - "5432:5432"
    volumes:
      - affiliateos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliateos -d affiliateos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  affiliateos_pgdata:
